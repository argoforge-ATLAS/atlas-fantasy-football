<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lineup HQ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Lineup HQ</h1>
    <button id="refreshBtn" aria-label="Refresh">&#x21bb;</button>
  </header>

  <nav id="leagueTabs" class="tabs"></nav>

  <main id="content">
    <p class="loading">Loading...</p>
  </main>

  <section id="adviceSection" class="card" style="margin: 0 1.25rem 1.25rem;">
    <h2>Ask for advice</h2>
    <textarea id="notesInput" placeholder="Optional: paste anything you read elsewhere (e.g. Fantasy Footballers' take) to factor in..." rows="3"></textarea>
    <button id="adviceBtn" class="primary-btn">Get start/sit &amp; waiver advice</button>
    <div id="adviceOutput"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
