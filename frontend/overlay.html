<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineup HQ overlay</title>
<style>
  /* Built for couch distance on a TV: big type, high contrast, and
     quiet unless something changed. Transparent background so it can
     sit over the broadcast. */
  :root { --good: #4ade80; --bad: #f87171; --text: #f5f5f7; --muted: #b0b4bb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  #panel { position: fixed; right: 2vw; top: 3vh; width: 34vw; min-width: 420px;
    background: rgba(12, 14, 18, 0.88); border-radius: 18px; padding: 1.2vw 1.4vw;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5); transition: opacity .35s, transform .35s; }
  #panel.hidden { opacity: 0; transform: translateX(6vw); pointer-events: none; }

  /* corner chip (always-on small state) */
  #chip { position: fixed; right: 2vw; bottom: 3vh; background: rgba(12,14,18,0.82);
    border-radius: 999px; padding: 0.5vw 1.2vw; font-size: 2.2vh; font-weight: 700;
    display: flex; gap: 1vw; align-items: center; transition: opacity .35s; }
  #chip.hidden { opacity: 0; }

  .head { display: flex; justify-content: space-between; align-items: center; font-size: 2vh; color: var(--muted); margin-bottom: 0.8vh; }
  .score-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 1vw; }
  .team { font-size: 2.2vh; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score { font-size: 6vh; font-weight: 800; font-variant-numeric: tabular-nums; }
  .score.lead { color: var(--good); } .score.trail { color: var(--bad); }
  .score.flash-up { animation: up 1.6s; } .score.flash-down { animation: down 1.6s; }
  @keyframes up { 0%,40% { background: rgba(74,222,128,.55); } 100% { background: transparent; } }
  @keyframes down { 0%,40% { background: rgba(248,113,113,.55); } 100% { background: transparent; } }
  .prob { font-size: 3.6vh; font-weight: 800; }
  .bar { height: 1.2vh; border-radius: 99px; background: rgba(248,113,113,.4); margin: 1.2vh 0; overflow: hidden; }
  .bar > div { height: 100%; background: var(--good); transition: width .5s; }
  .headline { font-size: 2.4vh; text-align: center; margin: 0.6vh 0 1.2vh; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2vw; }
  .col h4 { margin: 0 0 0.4vh; font-size: 1.9vh; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .group { margin-bottom: 1vh; }
  .group > .label { font-size: 1.6vh; color: var(--muted); margin-bottom: .2vh; }
  .p { display: flex; justify-content: space-between; font-size: 2.2vh; line-height: 1.35; gap: .6vw; }
  .p .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p .v { font-variant-numeric: tabular-nums; font-weight: 700; }
  .p.live .n::before { content: "● "; color: var(--good); }
  .hint { color: var(--muted); font-size: 1.7vh; text-align: center; margin-top: .6vh; }
  #err { position: fixed; left: 2vw; bottom: 2vh; color: var(--bad); font-size: 2vh; }
</style>
</head>
<body>
  <div id="panel" class="hidden"></div>
  <div id="chip" class="hidden"></div>
  <div id="err"></div>
<script>
// ?league=<sleeper league id>   which league (default: first)
// ?interval=20                  poll seconds (default 20)
// ?show=12                      seconds to keep the panel open after a score change
// ?mode=always                  keep the full panel up (default: auto-hide)
// Press Enter / OK on the remote (or tap) to pop the panel open.
const params = new URLSearchParams(location.search);
const POLL = Math.max(10, Number(params.get("interval")) || 20) * 1000;
const SHOW = Math.max(4, Number(params.get("show")) || 12) * 1000;
const ALWAYS = params.get("mode") === "always";

const panel = document.getElementById("panel");
const chip = document.getElementById("chip");
const err = document.getElementById("err");
let leagueId = params.get("league");
let last = null;
let hideTimer = null;

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f = (n, d = 1) => (n == null ? "–" : Number(n).toFixed(d));

function group(title, rows) {
  if (!rows.length) return "";
  return `<div class="group"><div class="label">${esc(title)}</div>${rows.map(p =>
    `<div class="p ${p.status}"><span class="n">${esc(p.name)}</span><span class="v">${f(p.points, 1)}${p.status === "final" || p.status === "bye" ? "" : ` <span style="color:var(--muted);font-weight:400">/${f(p.expected, 0)}</span>`}</span></div>`).join("")}</div>`;
}

function side(title, s) {
  const by = st => s.players.filter(p => st.includes(p.status));
  return `<div class="col"><h4>${esc(title)}</h4>
    ${group("Playing now", by(["live"]))}
    ${group("Yet to play", by(["upcoming"]))}
    ${group("Done", by(["final", "bye"]))}
  </div>`;
}

function render(d) {
  if (d.no_matchup) { panel.innerHTML = '<div class="hint">No matchup this week</div>'; return; }
  const lead = d.margin > 0, tie = d.margin === 0;
  const prev = last && !last.no_matchup ? last : null;
  const meFlash = prev ? (d.me.points > prev.me.points ? "flash-up" : d.me.points < prev.me.points ? "flash-down" : "") : "";
  const oppFlash = prev ? (d.opponent.points > prev.opponent.points ? "flash-down" : "") : ""; // their points hurt
  panel.innerHTML = `
    <div class="head"><span>Week ${esc(d.week)} · ${esc(d.league_name || d.label)}</span><span>${new Date(d.updated_at * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</span></div>
    <div class="score-row">
      <div><div class="team">${esc(d.me.team_name)}</div><div class="score ${tie ? "" : lead ? "lead" : "trail"} ${meFlash}">${f(d.me.points, 2)}</div></div>
      <div class="prob">${f(d.win_prob, 0)}%</div>
      <div><div class="team">${esc(d.opponent.team_name)}</div><div class="score ${tie ? "" : lead ? "trail" : "lead"} ${oppFlash}">${f(d.opponent.points, 2)}</div></div>
    </div>
    <div class="bar"><div style="width:${Math.max(0, Math.min(100, d.win_prob))}%"></div></div>
    ${d.headline ? `<div class="headline">${esc(d.headline)}</div>` : ""}
    <div class="cols">${side("You", d.me)}${side("Opponent", d.opponent)}</div>
    <div class="hint">Press OK to show / hide</div>`;
  chip.innerHTML = `<span style="color:${tie ? "#fff" : lead ? "var(--good)" : "var(--bad)"}">${f(d.me.points, 1)}</span><span style="color:var(--muted)">–</span><span>${f(d.opponent.points, 1)}</span><span style="color:var(--muted)">${f(d.win_prob, 0)}%</span>`;
}

function open(ms) {
  panel.classList.remove("hidden");
  chip.classList.add("hidden");
  clearTimeout(hideTimer);
  if (!ALWAYS) hideTimer = setTimeout(close, ms || SHOW);
}
function close() { panel.classList.add("hidden"); chip.classList.remove("hidden"); }

function changed(a, b) {
  if (!a || a.no_matchup || b.no_matchup) return false;
  return a.me.points !== b.me.points || a.opponent.points !== b.opponent.points;
}

async function tick() {
  try {
    if (!leagueId) {
      const leagues = await (await fetch("/api/leagues")).json();
      leagueId = leagues[0] && leagues[0].id;
    }
    const res = await fetch(`/api/leagues/${leagueId}/live-matchup`);
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    err.textContent = "";
    const didChange = changed(last, d);
    render(d);
    // Quiet by default: only pop open when someone scored.
    if (ALWAYS || didChange) open();
    else if (!last) { chip.classList.remove("hidden"); if (ALWAYS) open(); }
    last = d;
  } catch (e) {
    err.textContent = "Overlay can't reach Lineup HQ";
  }
}

// OK / Enter on the Android TV remote (or a tap) toggles the panel.
function toggle() { panel.classList.contains("hidden") ? open(SHOW * 1.5) : close(); }
document.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") toggle(); });
document.addEventListener("click", toggle);

tick();
setInterval(tick, POLL);
if (ALWAYS) open();
</script>
</body>
</html>
